<p style="margin:0 0 10px 0;color:#FC4C02;font-size:10px;font-weight:700;letter-spacing:1.6px;">ORDER #{{pedido_corto}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 22px 0;border:1px solid #2A2A2A;">
  {{#cada items}}
  <tr>
    {{#si .imagen}}
    <td width="60" valign="top" style="padding:14px 0 14px 16px;">
      <img src="{{.imagen}}" width="52" height="52" alt="" style="width:52px;height:52px;object-fit:cover;background:#1F1F1F;display:block;">
    </td>
    {{/si}}
    <td valign="middle" style="padding:14px 12px;color:#FFFFFF;font-size:14px;line-height:1.5;">
      <strong style="font-weight:700;">{{.nombre}}</strong><br>
      <span style="color:#7A7A7A;font-size:12px;letter-spacing:.4px;">QTY {{.cantidad}}</span>
    </td>
    <td valign="middle" align="right" style="padding:14px 16px 14px 0;color:#FFFFFF;font-size:14px;font-weight:700;white-space:nowrap;">{{.total}}</td>
  </tr>
  {{/cada}}
</table>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 6px 0;">
  <tr><td style="color:#7A7A7A;font-size:12px;letter-spacing:.6px;padding:3px 0;">SUBTOTAL</td>
      <td align="right" style="color:#C8C8C8;font-size:13px;padding:3px 0;">{{subtotal_f}}</td></tr>
  <tr><td style="color:#7A7A7A;font-size:12px;letter-spacing:.6px;padding:3px 0;">SHIPPING</td>
      <td align="right" style="color:#C8C8C8;font-size:13px;padding:3px 0;">{{envio_f}}</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:2px solid #FC4C02;margin-top:8px;">
  <tr><td style="color:#FFFFFF;font-size:13px;font-weight:700;letter-spacing:1px;padding-top:12px;">TOTAL</td>
      <td align="right" style="color:#FC4C02;font-size:24px;font-weight:700;letter-spacing:-.6px;padding-top:12px;">{{total_f}}</td></tr>
</table>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0;border:1px solid #e4e4e7;border-radius:10px;">
  <tr><td style="padding:16px 18px 6px 18px;color:#71717a;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;">
    Pedido #{{pedido_corto}}
  </td></tr>
  {{#cada items}}
  <tr><td style="padding:8px 18px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      {{#si .imagen}}
      <td width="56" valign="top" style="padding-right:12px;">
        <img src="{{.imagen}}" width="56" height="56" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px;background:#f4f4f5;display:block;">
      </td>
      {{/si}}
      <td valign="top" style="color:#18181b;font-size:14px;line-height:1.5;">
        <strong style="font-weight:600;">{{.nombre}}</strong><br>
        <span style="color:#71717a;font-size:13px;">Cantidad: {{.cantidad}}</span>
      </td>
      <td valign="top" align="right" style="color:#18181b;font-size:14px;font-weight:600;white-space:nowrap;padding-left:12px;">{{.total}}</td>
    </tr></table>
  </td></tr>
  {{/cada}}
  <tr><td style="padding:10px 18px 4px 18px;"><hr style="border:0;border-top:1px solid #e4e4e7;margin:0;"></td></tr>
  <tr><td style="padding:4px 18px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr><td style="color:#71717a;font-size:13px;padding:3px 0;">Subtotal</td>
          <td align="right" style="color:#3f3f46;font-size:13px;padding:3px 0;">{{subtotal_f}}</td></tr>
      <tr><td style="color:#71717a;font-size:13px;padding:3px 0;">Envío</td>
          <td align="right" style="color:#3f3f46;font-size:13px;padding:3px 0;">{{envio_f}}</td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:4px 18px 16px 18px;">
    <hr style="border:0;border-top:1px solid #e4e4e7;margin:0 0 10px 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="color:#18181b;font-size:15px;font-weight:700;">Total</td>
      <td align="right" style="color:#18181b;font-size:17px;font-weight:700;">{{total_f}}</td>
    </tr></table>
  </td></tr>
</table>
